name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: dart run build_runner build -d && git diff --exit-code
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  # macOS minutes cost 10x and Windows 2x on private repos, so platform
  # builds run only for PRs into main, pushes to main, and manual runs.
  build:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('tool/build_ffmpeg_macos.sh', 'tool/fetch_ffmpeg_windows.ps1') }}
      - name: Build LGPL FFmpeg (macOS)
        if: matrix.target == 'macos'
        run: '[ -x third_party/ffmpeg/macos/ffmpeg ] || tool/build_ffmpeg_macos.sh'
      - name: Fetch LGPL FFmpeg (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: if (-not (Test-Path third_party/ffmpeg/windows/ffmpeg.exe)) { ./tool/fetch_ffmpeg_windows.ps1 }
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release
      - name: FFmpeg is inside the app
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = macos ]; then
            test -x build/macos/Build/Products/Release/cutline.app/Contents/Resources/bin/ffmpeg
          else
            test -f build/windows/x64/runner/Release/bin/ffmpeg.exe
          fi
